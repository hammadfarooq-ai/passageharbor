name: Feature request
description: Suggest a focused improvement to the local PDF assistant.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: What task is difficult with the current application?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and tradeoffs
      description: Keep the single-user local scope in mind. Include alternatives if helpful.
    validations:
      required: true
